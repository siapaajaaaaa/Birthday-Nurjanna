<!-- ending.html -->
<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>The Last Surprise 💖</title>

<link rel="preconnect" href="https://fonts.googleapis.com">

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&family=Pacifico&display=swap" rel="stylesheet">

<style>

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

html{
  scroll-behavior:smooth;
}

body{
  min-height:100vh;
  overflow-x:hidden;
  overflow-y:auto;
  display:flex;
  justify-content:center;
  align-items:flex-start;
  background:linear-gradient(135deg,#ffd6e7,#ffc2d1,#ffe5ec);
  font-family:'Poppins',sans-serif;
  position:relative;
  padding:40px 20px;
}

/* FLOATING */

.float{
  position:absolute;
  animation:float 8s linear infinite;
  opacity:0.8;
  pointer-events:none;
}

@keyframes float{

  0%{
    transform:translateY(0) rotate(0deg);
    opacity:0;
  }

  50%{
    opacity:1;
  }

  100%{
    transform:translateY(-120vh) rotate(360deg);
    opacity:0;
  }

}

/* CARD */

.card{
  width:90%;
  max-width:720px;
  background:rgba(255,255,255,0.28);
  backdrop-filter:blur(12px);
  padding:45px 30px;
  border-radius:35px;
  text-align:center;
  position:relative;
  z-index:5;
  box-shadow:0 15px 35px rgba(0,0,0,0.12);
  animation:fade 1.5s;
  margin:40px 0;
}

@keyframes fade{

  from{
    opacity:0;
    transform:translateY(20px);
  }

  to{
    opacity:1;
    transform:translateY(0);
  }

}

/* TITLE */

.title{
  font-family:'Pacifico',cursive;
  font-size:3rem;
  color:#ff1493;
  margin-bottom:15px;
}

.subtitle{
  color:#d63384;
  margin-bottom:25px;
  line-height:2;
  font-size:1rem;
}

/* CAKE */

#bigCake{
  font-size:120px;
  margin:20px 0;
  animation:bounce 2s infinite;
}

@keyframes bounce{

  0%{
    transform:translateY(0);
  }

  50%{
    transform:translateY(-12px);
  }

  100%{
    transform:translateY(0);
  }

}

/* TEXT */

.text{
  color:#d63384;
  line-height:2;
  font-size:1rem;
  margin-top:20px;
}

.text p{
  margin-bottom:12px;
}

/* BUTTON */

.btn{
  margin-top:30px;
  padding:15px 35px;
  border:none;
  border-radius:30px;
  background:#ff1493;
  color:white;
  cursor:pointer;
  font-size:1rem;
  transition:0.3s;
  box-shadow:0 0 15px rgba(255,20,147,0.4);
}

.btn:hover{
  transform:scale(1.06);
}

/* FINAL SCREEN */

.final-love{
  position:fixed;
  inset:0;
  background:rgba(255,182,193,0.75);
  backdrop-filter:blur(18px);
  display:none;
  justify-content:center;
  align-items:center;
  flex-direction:column;
  z-index:999;
  animation:fade 1s;
  text-align:center;
  padding:20px;
}

.final-love h1{
  font-family:'Pacifico',cursive;
  color:#ff1493;
  font-size:3rem;
  margin-bottom:15px;
}

.final-love p{
  color:#d63384;
  font-size:1.2rem;
  line-height:2;
}

/* FINAL CAKE */

#finalCake{
  font-size:130px;
  margin:20px 0;
  animation:bounce 2s infinite;
}

/* BUTTON TIUP */

.blow-btn{
  margin-top:25px;
  padding:15px 35px;
  border:none;
  border-radius:30px;
  background:#ff1493;
  color:white;
  cursor:pointer;
  font-size:1rem;
  transition:0.3s;
  box-shadow:0 0 15px rgba(255,20,147,0.4);
}

.blow-btn:hover{
  transform:scale(1.06);
}

/* CONFETTI */

.confetti{
  position:fixed;
  top:-20px;
  font-size:25px;
  animation:fall 4s linear forwards;
  z-index:9999;
}

@keyframes fall{

  0%{
    transform:translateY(0) rotate(0deg);
    opacity:1;
  }

  100%{
    transform:translateY(120vh) rotate(720deg);
    opacity:0;
  }

}

/* MOBILE */

@media(max-width:600px){

  .title{
    font-size:2.2rem;
  }

  .card{
    padding:30px 20px;
  }

  #bigCake{
    font-size:90px;
  }

  #finalCake{
    font-size:95px;
  }

}

</style>
</head>

<body>

<!-- FLOATING -->

<script>

const icons=["🎈","✨","💌","🎂","🎁","🌸","💖"];

for(let i=0;i<50;i++){

  let item=document.createElement("div");

  item.className="float";

  item.innerHTML=icons[Math.floor(Math.random()*icons.length)];

  item.style.left=Math.random()*100+"%";

  item.style.fontSize=(Math.random()*25+20)+"px";

  item.style.animationDuration=(Math.random()*5+5)+"s";

  document.body.appendChild(item);

}

</script>

<!-- CONTENT -->

<div class="card">

<h1 class="title">
The Last Surprise 💖
</h1>

<p class="subtitle">
Sedikit halaman terakhir untuk kamu ✨
</p>

<!-- CAKE -->

<div id="bigCake">
🎂
</div>

<div class="text">

<p>
Makasih yaa udah baca semuanya sampai akhir 🥺💖
</p>

<p>
Semoga hal-hal baik selalu datang ke kamu,
dan semoga kamu selalu bahagia ✨
</p>

<br>

<p style="font-family:'Pacifico',cursive; font-size:1.3rem;">
— dari Manda, sahabat cantikmu 💌
</p>

</div>

<button class="btn" onclick="openLove()">
Tiup Lilinnya 🎂
</button>

</div>

<!-- FINAL -->

<div class="final-love" id="finalLove">

<h1>
Make A Wish ✨
</h1>

<div id="finalCake">
🕯️
</div>

<p id="wishText">
Tiup lilinnya dan buat harapan terbaik kamu 💖
</p>

<button class="blow-btn" onclick="blowCandle()">
Tiup Lilinnya 🎂
</button>

</div>

<script>

function openLove(){

  const final=document.getElementById("finalLove");

  final.style.display="flex";

}

/* TIUP LILIN */

function blowCandle(){

  document.querySelector(".blow-btn").style.display="none";

  document.getElementById("finalCake").innerHTML="🍰";

  document.getElementById("wishText").innerHTML=
  "Yeyyy 🥺💖 <br><br> Semoga semua harapan kamu terkabul ✨";

  /* CONFETTI */

  const icons=["🎈","💖","✨","🎉","🌸"];

  for(let i=0;i<40;i++){

    let conf=document.createElement("div");

    conf.className="confetti";

    conf.innerHTML=icons[Math.floor(Math.random()*icons.length)];

    conf.style.left=Math.random()*100+"%";

    conf.style.animationDuration=(Math.random()*2+2)+"s";

    document.body.appendChild(conf);

  }

  /* CLOSE */

  setTimeout(()=>{

    window.location.href="about:blank";

  },4000);

}

</script>

</body>
</html>
