<!-- login.html -->
<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login 💖</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&family=Pacifico&display=swap" rel="stylesheet">

<style>

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

body{
  height:100vh;
  overflow:hidden;
  display:flex;
  justify-content:center;
  align-items:center;
  background:linear-gradient(135deg,#ffd6e7,#ffc2d1,#ffe5ec);
  font-family:'Poppins',sans-serif;
  color:rgb(255, 0, 170);
  position:relative;
}

/* FLOATING LOVE */
.heart{
  position:absolute;
  bottom:-50px;
  color:pink;
  animation:float 6s linear infinite;
  opacity:0.7;
}

@keyframes float{
  0%{
    transform:translateY(0);
    opacity:0;
  }
  50%{
    opacity:1;
  }
  100%{
    transform:translateY(-110vh);
    opacity:0;
  }
}

/* CARD */
.card{
  width:90%;
  max-width:450px;
  padding:35px;
  border-radius:30px;
  text-align:center;
  background:rgba(255,255,255,0.25);
  backdrop-filter:blur(10px);
  box-shadow:0 8px 30px rgba(255,255,255,0.3);
  animation:fade 1s;
  z-index:5;
}

@keyframes fade{
  from{
    opacity:0;
    transform:scale(0.95);
  }
  to{
    opacity:1;
    transform:scale(1);
  }
}

h1{
  font-family:'Pacifico',cursive;
  margin-bottom:15px;
  font-size:2rem;
}

p{
  line-height:1.8;
}

/* PIN DISPLAY */
.pin-display{
  height:60px;
  border-radius:20px;
  background:rgba(255,255,255,0.3);
  display:flex;
  justify-content:center;
  align-items:center;
  margin:20px 0;
  font-size:2rem;
  letter-spacing:10px;
  color:#ff1493;
  font-weight:bold;
}

/* KEYPAD */
.keypad{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:15px;
}

.keypad button{
  height:65px;
  border:none;
  border-radius:20px;
  background:rgba(255,255,255,0.7);
  color:#ff1493;
  font-size:1.3rem;
  cursor:pointer;
  transition:0.3s;
  font-weight:bold;
}

.keypad button:hover{
  transform:scale(1.05);
  background:white;
}

/* SUCCESS POPUP */
.success-popup{
  position:fixed;
  top:0;
  left:0;
  width:100%;
  height:100%;
  background:rgba(255,255,255,0.2);
  backdrop-filter:blur(10px);
  display:none;
  justify-content:center;
  align-items:center;
  z-index:999;
}

.success-box{
  width:85%;
  max-width:320px;
  padding:35px;
  border-radius:30px;
  background:white;
  text-align:center;
  color:#ff1493;
  box-shadow:0 10px 40px rgba(0,0,0,0.15);
  animation:pop 0.5s;
}

@keyframes pop{
  from{
    transform:scale(0.7);
    opacity:0;
  }
  to{
    transform:scale(1);
    opacity:1;
  }
}

.check-icon{
  font-size:60px;
  animation:bounce 1s infinite;
}

@keyframes bounce{
  0%{
    transform:translateY(0);
  }
  50%{
    transform:translateY(-10px);
  }
  100%{
    transform:translateY(0);
  }
}

.success-box h2{
  margin-top:10px;
  margin-bottom:10px;
}

</style>
</head>

<body>

<!-- FLOATING HEART -->
<script>

for(let i=0;i<30;i++){

  let heart=document.createElement("div");

  heart.className="heart";
  heart.innerHTML="💖";

  heart.style.left=Math.random()*100+"%";
  heart.style.fontSize=(Math.random()*20+15)+"px";
  heart.style.animationDuration=(Math.random()*5+5)+"s";

  document.body.appendChild(heart);

}

</script>

<!-- CARD -->
<div class="card">

<h1>Hello Sahabatku Nurjanah </h1>

<p>
Sebelum masuk isi PIN dulu yaa ✨ <br>
PIN-nya tanggal bulan dan tahun lahir kamu
</p>

<br>

<div class="pin-display" id="pinDisplay">
○ ○ ○ ○ ○ ○ ○ ○
</div>

<div class="keypad">

<button onclick="addNumber('1')">1</button>
<button onclick="addNumber('2')">2</button>
<button onclick="addNumber('3')">3</button>

<button onclick="addNumber('4')">4</button>
<button onclick="addNumber('5')">5</button>
<button onclick="addNumber('6')">6</button>

<button onclick="addNumber('7')">7</button>
<button onclick="addNumber('8')">8</button>
<button onclick="addNumber('9')">9</button>

<button onclick="removeNumber()">⌫</button>
<button onclick="addNumber('0')">0</button>
<button onclick="checkPin()">OK</button>

</div>

</div>

<!-- SUCCESS -->
<div class="success-popup" id="successPopup">

<div class="success-box">

<div class="check-icon">💖</div>

<h2>Yeyyy Berhasil Masuk</h2>


</div>

</div>

<script>

/* PIN */
let pinInput="";

function addNumber(num){

  if(pinInput.length < 8){

    pinInput += num;

    updateDisplay();

  }

}

function removeNumber(){

  pinInput = pinInput.slice(0,-1);

  updateDisplay();

}

function updateDisplay(){

  let result="";

  for(let i=0;i<8;i++){

    if(i < pinInput.length){

      result += "● ";

    }else{

      result += "○ ";

    }

  }

  document.getElementById("pinDisplay").innerHTML=result;

}

/* CHECK PIN */
function checkPin(){

  if(pinInput === "10052005"){

    document.getElementById("successPopup").style.display="flex";

    setTimeout(() => {

      window.location.href="question.html";

    },3000);

  }else{

    alert("PIN salah 😭");

    pinInput="";

    updateDisplay();

  }

}

</script>

</body>
</html>
